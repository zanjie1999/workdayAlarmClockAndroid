plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
apply plugin: 'kotlin-android'

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.zyyme.workdayalarmclock"
        minSdk 14
        targetSdk 32
        versionCode 152
        versionName "51.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            debuggable false
            zipAlignEnabled true
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            zipAlignEnabled true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main {
            // Android列表文件中显示的jniLibs实际是libs
            jniLibs.srcDirs = ['libs']
        }
    }

    flavorDimensions "version"
    productFlavors {
        full {
            dimension "version"
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
        x86 {
            dimension "version"
            ndk {
                abiFilters "x86"
            }
        }
        arm7 {
            dimension "version"
            ndk {
                abiFilters "armeabi-v7a"
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

def targetOutputDir = new File(rootDir, "app/release")

afterEvaluate {
    android.applicationVariants.all { variant ->
        def variantName = variant.name
        // 找到对应的 assemble 任务
        def assembleTask = variant.assembleProvider.get()

        if (assembleTask != null) {
            // 在 assemble 任务执行完成后触发复制
            assembleTask.doLast {
                copy {
                    // 从默认输出目录获取生成的文件
                    from variant.outputs*.outputFile
                    // 复制到指定的目标文件夹
                    into targetOutputDir
                }
                delete variant.outputs*.outputFile
            }
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation "androidx.media:media:1.6.0"
    // 老系统的 JSSE 只有 CBC 套件，跟现在只收 AEAD 的服务器握手必失败，
    // 这里内置一份 Conscrypt（Play Services 升级老机器 TLS 用的同一套）
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    // 小智AI：WebSocket。
    // 钉 1.4.1 而不是最新的 1.5.x —— 1.5.x 的 Charsetfunctions 用了 java.nio.charset.StandardCharsets，
    // 那是 API 19 才有的类，在 4.0~4.3 上收发文本帧会直接 NoClassDefFoundError。
    // 1.4.1 是 Java 6 字节码、Charset.forName，且 run() 会复用外部 setSocket 进来的 TLS socket。
    implementation 'org.java-websocket:Java-WebSocket:1.4.1'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    // 纯 Java 的 Opus 编解码，不需要 NDK
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    // JVM 单测里跑 org.json
    testImplementation 'org.json:json:20180813'
}
