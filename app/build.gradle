plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
apply plugin: 'kotlin-android'

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.zyyme.workdayalarmclock"
        minSdk 14
        targetSdk 32
        versionCode 155
        versionName "52.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            debuggable false
            zipAlignEnabled true
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            zipAlignEnabled true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main {
            // Android列表文件中显示的jniLibs实际是libs
            jniLibs.srcDirs = ['libs', 'src/main/jniLibs']
        }
    }

    flavorDimensions "version"
    productFlavors {
        full {
            dimension "version"
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
        x86 {
            dimension "version"
            ndk {
                abiFilters "x86"
            }
        }
        arm7 {
            dimension "version"
            ndk {
                abiFilters "armeabi-v7a"
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

def targetOutputDir = new File(rootDir, "app/release")

def xiaozhiJniDir = file("src/main/jniLibs")
def xiaozhiAssetsDir = file("src/main/assets/xiaozhi_kws")
def xiaozhiRequiredBinaries = [
    new File(xiaozhiJniDir, "arm64-v8a/libonnxruntime.so"),
    new File(xiaozhiJniDir, "arm64-v8a/libsherpa-onnx-jni.so"),
    new File(xiaozhiJniDir, "armeabi-v7a/libonnxruntime.so"),
    new File(xiaozhiJniDir, "armeabi-v7a/libsherpa-onnx-jni.so"),
    new File(xiaozhiJniDir, "x86/libonnxruntime.so"),
    new File(xiaozhiJniDir, "x86/libsherpa-onnx-jni.so"),
    new File(xiaozhiAssetsDir, "encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"),
    new File(xiaozhiAssetsDir, "decoder-epoch-12-avg-2-chunk-16-left-64.onnx"),
    new File(xiaozhiAssetsDir, "joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx"),
    new File(xiaozhiAssetsDir, "silero_vad.onnx")
]

tasks.register("fetchXiaozhiKwsAssets") {
    group = "xiaozhi"
    description = "Download official Sherpa-ONNX v2.0.3 native libs and KWS/VAD ONNX models if missing."
    onlyIf {
        !project.hasProperty("skipXiaozhiKwsDownload") &&
            xiaozhiRequiredBinaries.any { !it.exists() || it.length() == 0L }
    }
    doLast {
        def downloadFile = { String rawUrl, File dest ->
            dest.parentFile.mkdirs()
            def tmp = new File(dest.parentFile, "${dest.name}.tmp")
            String currentUrl = rawUrl
            HttpURLConnection conn = null
            for (int hop = 0; hop < 8; hop++) {
                conn = (HttpURLConnection) new URL(currentUrl).openConnection()
                conn.instanceFollowRedirects = false
                conn.connectTimeout = 20000
                conn.readTimeout = 120000
                conn.setRequestProperty("User-Agent", "Gradle-fetchXiaozhiKwsAssets")
                int code = conn.responseCode
                if (code in [301, 302, 303, 307, 308]) {
                    String next = conn.getHeaderField("Location")
                    conn.disconnect()
                    if (!next) throw new GradleException("Redirect without Location from ${currentUrl}")
                    currentUrl = new URL(new URL(currentUrl), next).toString()
                    continue
                }
                if (code !in 200..299) {
                    conn.disconnect()
                    throw new GradleException("HTTP ${code} downloading ${currentUrl}")
                }
                break
            }
            try {
                conn.inputStream.withCloseable { input ->
                    tmp.withOutputStream { output ->
                        byte[] buf = new byte[32768]
                        int n
                        while ((n = input.read(buf)) != -1) {
                            output.write(buf, 0, n)
                        }
                    }
                }
            } finally {
                conn?.disconnect()
            }
            if (dest.exists()) dest.delete()
            if (!tmp.renameTo(dest)) {
                throw new GradleException("Failed to rename ${tmp} to ${dest}")
            }
        }

        def cacheDir = new File(buildDir, "tmp/xiaozhi_fetch")
        cacheDir.mkdirs()

        def neededSo = [
            "jni/arm64-v8a/libonnxruntime.so": new File(xiaozhiJniDir, "arm64-v8a/libonnxruntime.so"),
            "jni/arm64-v8a/libsherpa-onnx-jni.so": new File(xiaozhiJniDir, "arm64-v8a/libsherpa-onnx-jni.so"),
            "jni/armeabi-v7a/libonnxruntime.so": new File(xiaozhiJniDir, "armeabi-v7a/libonnxruntime.so"),
            "jni/armeabi-v7a/libsherpa-onnx-jni.so": new File(xiaozhiJniDir, "armeabi-v7a/libsherpa-onnx-jni.so"),
            "jni/x86/libonnxruntime.so": new File(xiaozhiJniDir, "x86/libonnxruntime.so"),
            "jni/x86/libsherpa-onnx-jni.so": new File(xiaozhiJniDir, "x86/libsherpa-onnx-jni.so")
        ]
        if (neededSo.values().any { !it.exists() || it.length() == 0L }) {
            def aarFile = new File(cacheDir, "sherpa-onnx-2.0.3.aar")
            logger.lifecycle("Downloading Sherpa-ONNX v2.0.3 native libraries...")
            downloadFile("https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar", aarFile)
            new java.util.zip.ZipFile(aarFile).withCloseable { zf ->
                neededSo.each { entryName, outFile ->
                    def entry = zf.getEntry(entryName)
                    if (entry == null) throw new GradleException("Missing ${entryName} in ${aarFile}")
                    outFile.parentFile.mkdirs()
                    zf.getInputStream(entry).withCloseable { input ->
                        outFile.withOutputStream { output -> input.transferTo(output) }
                    }
                }
            }
            aarFile.delete()
        }

        def kwsPrefix = "sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01"
        def neededKws = [
            "encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx",
            "decoder-epoch-12-avg-2-chunk-16-left-64.onnx",
            "joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx",
            "tokens.txt"
        ]
        if (neededKws.any { name -> def f = new File(xiaozhiAssetsDir, name); !f.exists() || f.length() == 0L }) {
            def kwsArchive = new File(cacheDir, "${kwsPrefix}.tar.bz2")
            def unpackDir = new File(cacheDir, "kws_unpack")
            logger.lifecycle("Downloading Sherpa-ONNX KWS model...")
            downloadFile("https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/${kwsPrefix}.tar.bz2", kwsArchive)
            unpackDir.deleteDir()
            unpackDir.mkdirs()
            ant.untar(src: kwsArchive, dest: unpackDir, compression: "bzip2")
            xiaozhiAssetsDir.mkdirs()
            neededKws.each { name ->
                def srcFile = new File(unpackDir, "${kwsPrefix}/${name}")
                if (!srcFile.exists()) throw new GradleException("Missing ${srcFile} after untar")
                def dstFile = new File(xiaozhiAssetsDir, name)
                srcFile.withInputStream { input ->
                    dstFile.withOutputStream { output -> input.transferTo(output) }
                }
            }
            unpackDir.deleteDir()
            kwsArchive.delete()
        }

        def vadFile = new File(xiaozhiAssetsDir, "silero_vad.onnx")
        if (!vadFile.exists() || vadFile.length() == 0L) {
            logger.lifecycle("Downloading Silero VAD model...")
            downloadFile("https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx", vadFile)
        }
    }
}

preBuild.dependsOn(fetchXiaozhiKwsAssets)

afterEvaluate {
    android.applicationVariants.all { variant ->
        def variantName = variant.name
        // 找到对应的 assemble 任务
        def assembleTask = variant.assembleProvider.get()

        if (assembleTask != null) {
            // 在 assemble 任务执行完成后触发复制
            assembleTask.doLast {
                copy {
                    // 从默认输出目录获取生成的文件
                    from variant.outputs*.outputFile
                    // 复制到指定的目标文件夹
                    into targetOutputDir
                }
                delete variant.outputs*.outputFile
            }
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation "androidx.media:media:1.6.0"
    // 老系统的 JSSE 只有 CBC 套件，跟现在只收 AEAD 的服务器握手必失败，
    // 这里内置一份 Conscrypt（Play Services 升级老机器 TLS 用的同一套）
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    // 小智AI：WebSocket。
    // 钉 1.4.1 而不是最新的 1.5.x —— 1.5.x 的 Charsetfunctions 用了 java.nio.charset.StandardCharsets，
    // 那是 API 19 才有的类，在 4.0~4.3 上收发文本帧会直接 NoClassDefFoundError。
    // 1.4.1 是 Java 6 字节码、Charset.forName，且 run() 会复用外部 setSocket 进来的 TLS socket。
    implementation 'org.java-websocket:Java-WebSocket:1.4.1'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    // 纯 Java 的 Opus 编解码，不需要 NDK
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    // JVM 单测里跑 org.json
    testImplementation 'org.json:json:20180813'
}
